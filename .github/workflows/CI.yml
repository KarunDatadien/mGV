name: CI tests

on:
  push:
    branches:
      - CI

permissions:
  actions: write
  contents: read

jobs:
  test:
    name: Run validation script
    runs-on: ubuntu-latest

    steps:
      # 1. Check out repo
      - uses: actions/checkout@v4

      # 2. Set up Julia
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v2

      - name: Install Julia dependencies
        run: julia --project -e 'using Pkg; Pkg.instantiate()'

      # 3. Set up Python & Numpy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Show file paths
        run: |
          pwd
          ls -la
          ls -la input_data/mekong/

      # 4. Execute the script
      - name: Run validations
        run: bash run_validations.sh

      # 5. Debug: show what was produced
      - name: Debug output files
        run: |
          echo "=== output_data/ ==="
          find output_data/ -type f | sort || echo "(empty or missing)"
          echo "=== validations/*.png ==="
          find validations/ -name "*.png" | sort || echo "(no PNGs found)"

      # 6. Upload the generated plots
      - name: Upload plot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-dashboards
          path: validations/*.png
